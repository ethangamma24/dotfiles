# Execute your favorite apps at launch
exec-once = waybar & swww-daemon & mpd & 1password

exec-once = [workspace 10 silent] rhythmbox
exec-once = [workspace 7 silent] steam
exec-once = [workspace 4 silent] nautilus
exec-once = [workspace 3 silent] ghostty
exec-once = [workspace 2 silent] signal-desktop
exec-once = [workspace 1 silent] librewolf

# Set wallpapers on login
# exec-once = ~/.config/swww/random.sh &
exec-once = ~/.config/swww/set.sh &

# Authentication Agent
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

# Screen share stuff
# exec-once = /usr/libexec/xdg-desktop-portal & /usr/libexec/xdg-desktop-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

