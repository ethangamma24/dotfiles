[dependencies]
cmake = { version = "latest" }
fzf = { version = "latest" }
gcc = { version = "latest" }
git = { version = "latest" }
hyprland = { steps = [ "git clone --recursive https://github.com/hyprwm/Hyprland", "make -C ./Hyprland all && sudo make -C ./Hyprland install" ], needs = ["git", "cmake", "gcc"] }
nvm = { steps = [ "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash", "export NVM_DIR=\"$OME/.nvm\"", "[ -s \"$NVM_DIR/nvm.sh\" ]", "\\. \"$NVM_DIR/nvm.sh\"" ] }
nvim = { script = "nvim.sh" }
ripgrep = { version = "14.1.1-1" }
tmux = { version = "latest", post_install_script = "tmux.sh" }
zig = { version = "0.13.0" }
zsh = { version = "latest", post_install_steps = [ "chsh -s $(which zsh)" ] }
