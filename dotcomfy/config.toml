[dependencies]
cmake = { version = "latest" }
fzf = { version = "latest" }
git = { version = "latest" }
nvm = { steps = [ "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash", "export NVM_DIR=\"$HOME/.nvm\"", "[ -s \"$NVM_DIR/nvm.sh\" ]", "\\. \"$NVM_DIR/nvm.sh\"" ] }
nvim = { script = "nvim.sh" }
ripgrep = { version = "14.1.1-1" }
tmux = { post_install_script = "tmux.sh" }
zig = { version = "0.13.0" }
zsh = { post_install_steps = [ "chsh -s $(which zsh)" ] }
